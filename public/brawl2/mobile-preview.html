<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brawl mobile layout check</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#08151d;color:#e9dfc5;font:16px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}h1{font-size:18px;margin:0}button,select{font:inherit;padding:10px;color:inherit;border:1px solid #a28a59;background:#18323c;border-radius:6px}iframe{display:block;border:0;outline:1px solid #bda56e;background:#091820;max-width:none}p{font-size:14px;color:#afc4ba}
</style></head><body><header><h1>Landscape layout check</h1><label>Viewport <select id="size"><option value="844,390">844 × 390</option><option value="852,393">852 × 393</option><option value="667,375">667 × 375</option><option value="740,320">740 × 320 · browser bars</option><option value="568,320">568 × 320</option><option value="1363,936">1363 × 936</option></select></label><button id="rotate">Rotate viewport</button><label><input id="desktop" type="checkbox"> Original desktop controls</label></header><iframe id="game" title="Brawl game preview" width="844" height="390" src="./?mobile=1"></iframe><p>Layout preview. Actual touch, Safari safe areas and phone performance still require a device check.</p><script>
const frame=document.querySelector('#game'),size=document.querySelector('#size');let rotated=false;
function resize(){const [w,h]=size.value.split(',').map(Number);frame.width=rotated?h:w;frame.height=rotated?w:h;}
size.onchange=resize;document.querySelector('#rotate').onclick=()=>{rotated=!rotated;resize();};document.querySelector('#desktop').onchange=e=>{frame.src=e.target.checked?'./':'./?mobile=1';};
</script></body></html>
