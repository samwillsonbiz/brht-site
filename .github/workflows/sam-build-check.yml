name: SAM build check

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "app/sam/**"
      - "app/api/sam/**"
      - ".github/workflows/sam-build-check.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: build
        name: Run build and capture diagnostics
        shell: bash
        run: |
          set +e
          npm run build > .sam-build-log.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 250 .sam-build-log.txt
          exit 0
      - name: Commit diagnostic log on failure
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name "sam-build-check"
          git config user.email "sam-build-check@users.noreply.github.com"
          git add -f .sam-build-log.txt
          git commit -m "Add temporary SAM build diagnostics" || true
          git push
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
