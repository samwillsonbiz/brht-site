name: SAM build check

on:
  push:
    branches: [main]
    paths:
      - "app/sam/**"
      - "app/api/sam/**"
      - ".github/workflows/sam-build-check.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
