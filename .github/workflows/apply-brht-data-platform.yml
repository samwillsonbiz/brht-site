name: Apply BRHT reusable data platform

on:
  push:
    branches:
      - feat/brht-dashboard-hub

permissions:
  contents: write

jobs:
  apply-platform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/brht-dashboard-hub
          fetch-depth: 0

      - name: Download and verify implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://snappy-sirocco-mafk7k3.tmp.now/brht-platform-update-20261110.tar.xz" -o /tmp/brht-platform-update.tar.xz
          echo "0cd3eeaf90b3ee32a02ecc5586d201752b64dc0ebcabc5c37d85a850751fade1  /tmp/brht-platform-update.tar.xz" | sha256sum --check --strict

      - name: Replace dashboard-only prototype with reusable platform
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            app/api/dashboards/fable-fury/route.ts \
            app/dashboards/fable-fury/page.tsx \
            components/brht-dashboard/FableFuryDashboard.tsx \
            docs/brht-dashboard-connection.md \
            sql/brht-dashboard-read-model.sql
          rmdir app/api/dashboards/fable-fury app/dashboards/fable-fury 2>/dev/null || true
          tar -xJf /tmp/brht-platform-update.tar.xz
          node -e "for (const file of ['n8n/brht-ingest-template.json','n8n/fable-fury-postgres-backfill.json','n8n/fable-fury-postgres-live-sync.json','examples/brht/commerce-daily.json','examples/brht/paid-media-daily.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'));"
          rm -f .github/workflows/apply-brht-data-platform.yml

      - name: Commit reusable platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build reusable BRHT data platform"
          git push origin HEAD:feat/brht-dashboard-hub
