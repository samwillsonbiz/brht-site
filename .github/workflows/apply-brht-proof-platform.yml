name: Apply BRHT proof platform

on:
  push:
    branches:
      - feat/brht-proof-platform

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/brht-proof-platform
          fetch-depth: 0

      - name: Download verified update bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://zippy-sable-lk7anq7.tmp.now/brht-update-20261110.tar.xz" -o /tmp/brht-update.tar.xz
          echo "99b5ff5d71012971c2ba395e97bd059fe21d6c7cb2c2392379d2fcdf6c3c7197  /tmp/brht-update.tar.xz" | sha256sum --check --strict

      - name: Apply landing page and analytics experience
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/brht-update.tar.xz
          rm -rf .brht-update
          rm -f .github/workflows/apply-brht-proof-platform.yml

      - name: Commit applied implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Reposition BRHT and add Fable Fury analytics experience"
          git push origin HEAD:feat/brht-proof-platform
