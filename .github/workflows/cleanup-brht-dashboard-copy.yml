name: Clean up BRHT dashboard copy

on:
  push:
    branches:
      - feat/brht-dashboard-hub

permissions:
  contents: write

jobs:
  cleanup-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/brht-dashboard-hub
          fetch-depth: 0

      - name: Remove legacy table-name language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/brht-dashboard/BusinessDashboard.tsx')
          text = path.read_text()
          replacements = {
              'Waiting for daily_channel_metrics.': 'Waiting for normalized daily metrics from connected sources.',
              'Waiting for shopify_product_daily.': 'Waiting for normalized product performance from connected sources.',
              'Waiting for sync_runs and channel timestamps.': 'Waiting for source sync history and freshness timestamps.',
              'Financial logic stays in the reporting database.': 'Financial logic stays in the BRHT reporting model.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected dashboard copy: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -f .github/workflows/cleanup-brht-dashboard-copy.yml

      - name: Commit copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy table references from dashboard"
          git push origin HEAD:feat/brht-dashboard-hub
